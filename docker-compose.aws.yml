version: "3.9"
# Standalone production compose for AWS deployment.
# Run on each VM with its own .env file:
#   docker compose -f docker-compose.aws.yml up -d --build
#
# No local postgres — all services connect to RDS via RDS_HOST in .env

x-common-env: &common-env
  POSTGRES_HOST: ${RDS_HOST:?RDS_HOST required}
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${DB_USER:-traffic_admin}
  POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
  POSTGRES_DB: ${DB_NAME:-traffic_service}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:-traffic}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
  JWT_ALGORITHM: HS256
  JWT_EXPIRY_MINUTES: 60

x-infra-depends: &infra-depends
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "0.0.0.0:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-traffic}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
    ports:
      - "15672:15672"
      - "0.0.0.0:5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  api_gateway:
    build: ./services/api_gateway
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      AUTH_SERVICE_URL: http://auth_service:8001
      BOOKING_SERVICE_URL: http://booking_service:8002
      VERIFICATION_SERVICE_URL: http://verification_service:8003
      NOTIFICATION_SERVICE_URL: http://notification_service:8004
      ANALYTICS_SERVICE_URL: http://analytics_service:8005
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped
    depends_on:
      <<: *infra-depends

  auth_service:
    build: ./services/auth_service
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      SERVICE_PORT: 8001
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped
    depends_on:
      <<: *infra-depends

  booking_service:
    build: ./services/booking_service
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      SERVICE_PORT: 8002
      LOCAL_REGION: ${LOCAL_REGION:?LOCAL_REGION required}
      PEER_BOOKING_URL: ${PEER_BOOKING_URL:-}
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped
    depends_on:
      <<: *infra-depends

  verification_service:
    build: ./services/verification_service
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
      SERVICE_PORT: 8003
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped
    depends_on:
      <<: *infra-depends

  notification_service:
    build: ./services/notification_service
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
      SERVICE_PORT: 8004
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped
    depends_on:
      <<: *infra-depends

  analytics_service:
    build: ./services/analytics_service
    ports:
      - "8005:8005"
    environment:
      <<: *common-env
      SERVICE_PORT: 8005
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped
    depends_on:
      <<: *infra-depends

  frontend:
    build: ./services/frontend
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    restart: unless-stopped
    depends_on:
      - api_gateway

volumes:
  redis_data:
  rabbitmq_data:
