version: "3.9"

x-common-env: &common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: traffic_admin
  POSTGRES_PASSWORD: dev_password
  POSTGRES_DB: traffic_service
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  JWT_SECRET: dev-secret-change-in-production
  JWT_ALGORITHM: HS256
  JWT_EXPIRY_MINUTES: 60

x-service-depends: &service-depends
  postgres:
    condition: service_healthy
  db_bootstrap:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: traffic_admin
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: traffic_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_admin -d traffic_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  db_bootstrap:
    image: postgres:15
    environment:
      PGPASSWORD: dev_password
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/init.sql:/init.sql:ro
    command:
      - /bin/sh
      - -c
      - |
        until pg_isready -h postgres -U traffic_admin -d traffic_service; do sleep 1; done
        psql -h postgres -U traffic_admin -d traffic_service -f /init.sql
    restart: "no"

  api_gateway:
    build: ./services/api_gateway
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      AUTH_SERVICE_URL: http://auth_service:8001
      BOOKING_SERVICE_URL: http://booking_service:8002
      VERIFICATION_SERVICE_URL: http://verification_service:8003
      NOTIFICATION_SERVICE_URL: http://notification_service:8004
      ANALYTICS_SERVICE_URL: http://analytics_service:8005
    volumes:
      - ./shared:/app/shared
    depends_on:
      <<: *service-depends

  auth_service:
    build: ./services/auth_service
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      SERVICE_PORT: 8001
    volumes:
      - ./shared:/app/shared
    depends_on:
      <<: *service-depends

  booking_service:
    build: ./services/booking_service
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      SERVICE_PORT: 8002
    volumes:
      - ./shared:/app/shared
    depends_on:
      <<: *service-depends

  verification_service:
    build: ./services/verification_service
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
      SERVICE_PORT: 8003
    volumes:
      - ./shared:/app/shared
    depends_on:
      <<: *service-depends

  notification_service:
    build: ./services/notification_service
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
      SERVICE_PORT: 8004
    volumes:
      - ./shared:/app/shared
    depends_on:
      <<: *service-depends

  analytics_service:
    build: ./services/analytics_service
    ports:
      - "8005:8005"
    environment:
      <<: *common-env
      SERVICE_PORT: 8005
    volumes:
      - ./shared:/app/shared
    depends_on:
      <<: *service-depends

  frontend:
    build: ./services/frontend
    ports:
      - "3000:3000"
    depends_on:
      - api_gateway

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
