server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the gateway (K8s service DNS)
    # In K8s: api-gateway.traffic-system.svc.cluster.local
    # The resolver directive handles K8s DNS
    location /api/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=10s;
        set $upstream http://api-gateway.traffic-system.svc.cluster.local:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Health check endpoint for K8s probes
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
