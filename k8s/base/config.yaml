apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-config
  namespace: traffic-system
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "traffic_admin"
  POSTGRES_DB: "traffic_service"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRY_MINUTES: "60"
  # Inter-service URLs (K8s service DNS)
  AUTH_SERVICE_URL: "http://auth-service:8001"
  BOOKING_SERVICE_URL: "http://booking-service:8002"
  VERIFICATION_SERVICE_URL: "http://verification-service:8003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8004"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8005"
---
apiVersion: v1
kind: Secret
metadata:
  name: traffic-secrets
  namespace: traffic-system
type: Opaque
stringData:
  POSTGRES_PASSWORD: "dev_password"
  RABBITMQ_PASSWORD: "guest"
  JWT_SECRET: "dev-secret-change-in-production"
