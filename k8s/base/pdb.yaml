# PodDisruptionBudgets ensure at least 1 pod stays running
# during voluntary disruptions (node drain, rolling updates)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: traffic-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: booking-service-pdb
  namespace: traffic-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: booking-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: traffic-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
